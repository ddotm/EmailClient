name: 'idempotentcookie-email-$(Date:yyyyMMdd)$(Rev:.r)'

trigger:
  branches:
    include:
      - main

pr: none

pool:
  vmImage: 'windows-latest'
  workspace:
    clean: all

variables:
  configuration:       'Release'
  dotNetVersion:       '10.x'
  solutionPath:        'IdempotentCookie.Email.slnx'
  packageProjectPath:  'IdempotentCookie.Email.Package/IdempotentCookie.Email.Package.csproj'
  outputDir:           '$(Build.ArtifactStagingDirectory)/nuget'

stages:
- stage: BuildTestPack
  displayName: '🏗️ Build, Test, and Pack'
  jobs:
    - job: Build
      displayName: '🔧 Build, Test, Pack'
      steps:
        - checkout: self
          fetchDepth: "0"

        - task: PowerShell@2
          name: DetectPublishChanges
          displayName: 'Detect Publishable Changes'
          inputs:
            targetType: 'inline'
            pwsh: true
            script: |
              $publishablePrefixes = @(
                'IdempotentCookie.Email.Infrastructure/',
                'IdempotentCookie.Email.Smtp/',
                'IdempotentCookie.Email.Mailgun/',
                'IdempotentCookie.Email.SendGrid/',
                'IdempotentCookie.Email.Office365/',
                'IdempotentCookie.Email.Package/'
              )

              $shouldPublish = $true
              $previousCommitAvailable = $true

              try {
                $baseCommit = (git rev-parse HEAD~1).Trim()
              }
              catch {
                $previousCommitAvailable = $false
              }

              if ($previousCommitAvailable) {
                $changedFiles = @(git diff --name-only $baseCommit HEAD | Where-Object { -not [string]::IsNullOrWhiteSpace($_) })

                Write-Host 'Changed files:'
                foreach ($changedFile in $changedFiles) {
                  Write-Host " - $changedFile"
                }

                $shouldPublish = $false
                foreach ($changedFile in $changedFiles) {
                  $normalizedPath = $changedFile.Replace('\', '/')
                  if ($publishablePrefixes.Where({ $normalizedPath.StartsWith($_, [System.StringComparison]::OrdinalIgnoreCase) }).Count -gt 0) {
                    $shouldPublish = $true
                    break
                  }
                }
              }
              else {
                Write-Host 'No previous commit available. Treating this run as publishable.'
              }

              Write-Host "Should publish package: $shouldPublish"
              Write-Host "##vso[task.setvariable variable=ShouldPublishPackage;isOutput=true]$($shouldPublish.ToString().ToLowerInvariant())"

        - script: |
            echo "Branch: $(Build.SourceBranch)"
          displayName: 'Print Build.SourceBranch'
        - task: UseDotNet@2
          displayName: 'Install .NET SDK'
          inputs:
            packageType: sdk
            version: '$(dotNetVersion)'

        - script: dotnet restore $(solutionPath)
          displayName: 'Restore Solution'

        - script: dotnet build $(solutionPath) --configuration $(configuration) --no-restore
          displayName: 'Build Solution'

        - script: dotnet test $(solutionPath) --configuration $(configuration) --no-build --verbosity normal
          displayName: 'Run Unit Tests'

        - script: |
            dotnet test IdempotentCookie.Email.Mailgun.Tests/IdempotentCookie.Email.Mailgun.Tests.csproj --configuration $(configuration) --no-build --verbosity normal /p:CollectCoverage=true /p:CoverletOutputFormat=cobertura
            dotnet test IdempotentCookie.Email.Smtp.Tests/IdempotentCookie.Email.Smtp.Tests.csproj --configuration $(configuration) --no-build --verbosity normal /p:CollectCoverage=true /p:CoverletOutputFormat=cobertura
            dotnet test IdempotentCookie.Email.SendGrid.Tests/IdempotentCookie.Email.SendGrid.Tests.csproj --configuration $(configuration) --no-build --verbosity normal /p:CollectCoverage=true /p:CoverletOutputFormat=cobertura
            dotnet test IdempotentCookie.Email.Office365.Tests/IdempotentCookie.Email.Office365.Tests.csproj --configuration $(configuration) --no-build --verbosity normal /p:CollectCoverage=true /p:CoverletOutputFormat=cobertura
            dotnet test IdempotentCookie.Email.DependencyInjection.Tests/IdempotentCookie.Email.DependencyInjection.Tests.csproj --configuration $(configuration) --no-build --verbosity normal /p:CollectCoverage=true /p:CoverletOutputFormat=cobertura
          displayName: 'Enforce Coverage Thresholds'

        - script: dotnet pack $(packageProjectPath) --configuration $(configuration) --no-build -o $(outputDir)
          displayName: 'Pack NuGet Package'

        - task: PublishPipelineArtifact@1
          displayName: 'Publish NuGet Artifacts'
          inputs:
            targetPath: '$(outputDir)'
            artifact: 'nuget-package'
            publishLocation: 'pipeline'

- stage: PublishNuGet
  displayName: '🚀 Publish to NuGet.org'
  dependsOn: BuildTestPack
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'), eq(dependencies.BuildTestPack.outputs['Build.DetectPublishChanges.ShouldPublishPackage'], 'true'))
  jobs:
    - job: Push
      displayName: 'Push to NuGet.org'
      steps:
        - task: DownloadPipelineArtifact@2
          displayName: 'Download Package Artifacts'
          inputs:
            buildType: 'current'
            artifactName: 'nuget-package'
            targetPath: '$(Pipeline.Workspace)/artifacts'

        - task: NuGetToolInstaller@1
          displayName: 'Install NuGet Tool'

        - script: |
            dotnet nuget push "$(Pipeline.Workspace)/artifacts/**/*.nupkg" --api-key $(NUGET_API_KEY) --source "https://api.nuget.org/v3/index.json" --skip-duplicate
            dotnet nuget push "$(Pipeline.Workspace)/artifacts/**/*.snupkg" --api-key $(NUGET_API_KEY) --source "https://api.nuget.org/v3/index.json" --skip-duplicate
          displayName: 'Push .nupkg and .snupkg to NuGet.org'